name: Student Hub Android
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/student-hub-android.yml', 'logo-student-v034.png']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p android :app:assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Velthon-Student-Hub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Velthon-Student-Hub-Android
          path: Velthon-Student-Hub.apk
